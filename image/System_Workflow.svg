th="2"/><text x="780.0" y="513.7" font-size="21" fill="#ececec" text-anchor="middle">Question Strategist</text><text x="780.0" y="533.8" font-size="14" fill="#9a9a9a" text-anchor="middle">Groq phrases the best question</text><polyline points="780,200 780,230" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="780,320 780,350" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="780,440 780,470" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><rect x="570" y="610" width="420" height="130" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="780.0" y="655.5" font-size="21" fill="#ececec" text-anchor="middle">Compatibility score</text><text x="780.0" y="675.6" font-size="14" fill="#9a9a9a" text-anchor="middle">Lifestyle 35%  Taste 30%  Preferences 15%</text><text x="780.0" y="693.8" font-size="14" fill="#9a9a9a" text-anchor="middle">Budget 10%  Location 10%</text><text x="780.0" y="712.0" font-size="14" fill="#9a9a9a" text-anchor="middle">Few answers? Scores stay modest</text><polyline points="780,560 780,610" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="960,515 982,515 982,150 960,150" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="990" y="330.0" font-size="12" fill="#e08a2e" text-anchor="start">Answer,</text><text x="990" y="345.6" font-size="12" fill="#e08a2e" text-anchor="start">narrow,</text><text x="990" y="361.2" font-size="12" fill="#e08a2e" text-anchor="start">repeat</text><polyline points="410,595 490,595 490,155 600,155" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><rect x="1150" y="110" width="340" height="140" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="1320.0" y="168.3" font-size="2