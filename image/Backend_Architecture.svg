<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ececec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#121212"/><rect x="40" y="210" width="150" height="76" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="115.0" y="255.8" font-size="21" fill="#ececec" text-anchor="middle">User</text><rect x="280" y="210" width="230" height="76" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="395.0" y="246.0" font-size="21" fill="#ececec" text-anchor="middle">Frontend</text><text x="395.0" y="267.2" font-size="15" fill="#9a9a9a" text-anchor="middle">Next.js</text><rect x="660" y="210" width="250" height="76" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="785.0" y="255.8" font-size="21" fill="#ececec" text-anchor="middle">FastAPI Endpoint</text><polyline points="190,248 280,248" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="510,248 660,248" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><text x="585" y="180.0" font-size="16" fill="#e08a2e" text-anchor="middle">Answers, filters,</text><text x="585" y="200.8" font-size="16" fill="#e08a2e" text-anchor="middle">messages (REST)</text><polyline points="785,210 785,120 395,120 395,210" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><text x="590" y="104.0" font-size="16" fill="#e08a2e" text-anchor="middle">Returns ranked matches, questions and chat replies</text><rect x="1000" y="70" width="200" height="76" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="1100.0" y="106.0" font-size="21" fill="#ececec" text-anchor="middle">Qloo API</text><text x="1100.0" y="127.2" font-size="15" fill="#9a9a9a" text-anchor="middle">taste graph</text><rect x="1000" y="210" width="200" height="76" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="1100.0" y="246.0" font-size="21" fill="#ececec" text-anchor="middle">Groq LLM</text><text x="1100.0" y="267.2" font-size="15" fill="#9a9a9a" text-anchor="middle">gpt-oss-120b</text><polyline points="910,228 955,228 955,108 1000,108" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="910,258 1000,258" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><text x="1100" y="172.0" font-size="15" fill="#e08a2e" text-anchor="middle">Taste entities &amp;</text><text x="1100" y="191.5" font-size="15" fill="#e08a2e" text-anchor="middle">hangout spots</text><text x="1100" y="322.0" font-size="15" fill="#e08a2e" text-anchor="middle">Picks &amp; phrases questions,</text><text x="1100" y="341.5" font-size="15" fill="#e08a2e" text-anchor="middle">explains matches,</text><text x="1100" y="361.0" font-size="15" fill="#e08a2e" text-anchor="middle">plays the chat personas</text><rect x="360" y="420" width="260" height="80" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="490.0" y="458.0" font-size="21" fill="#ececec" text-anchor="middle">Matching Engine</text><text x="490.0" y="479.2" font-size="15" fill="#9a9a9a" text-anchor="middle">in-memory profile pool</text><rect x="700" y="420" width="260" height="80" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="830.0" y="454.1" font-size="21" fill="#ececec" text-anchor="middle">PostgreSQL</text><text x="830.0" y="481.4" font-size="21" fill="#ececec" text-anchor="middle">+ Neon DB</text><polyline points="740,286 740,352 490,352 490,420" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><text x="620" y="318.0" font-size="15" fill="#e08a2e" text-anchor="middle">Filters the pool, scores</text><text x="620" y="337.5" font-size="15" fill="#e08a2e" text-anchor="middle">questions and matches</text><polyline points="870,286 870,420" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><text x="858" y="376.0" font-size="15" fill="#e08a2e" text-anchor="end">Stores users, chats</text><text x="858" y="395.5" font-size="15" fill="#e08a2e" text-anchor="end">and message requests</text><polyline points="700,470 620,470" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="660" y="524.0" font-size="14" fill="#e08a2e" text-anchor="middle">Loaded at startup</text></svg>