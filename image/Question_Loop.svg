<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1140" viewBox="0 0 920 1140" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ececec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#121212"/><rect x="310" y="30" width="300" height="70" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="460.0" y="63.0" font-size="21" fill="#ececec" text-anchor="middle">User answers</text><text x="460.0" y="84.2" font-size="15" fill="#9a9a9a" text-anchor="middle">You and Them</text><rect x="240" y="150" width="440" height="90" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="460.0" y="183.3" font-size="21" fill="#ececec" text-anchor="middle">Apply the answer</text><text x="460.0" y="204.5" font-size="15" fill="#9a9a9a" text-anchor="middle">Deal-breakers remove people outright</text><text x="460.0" y="224.0" font-size="15" fill="#9a9a9a" text-anchor="middle">Everything else only softens the score</text><rect x="310" y="290" width="300" height="70" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="460.0" y="332.8" font-size="21" fill="#ececec" text-anchor="middle">Measure the live pool</text><rect x="220" y="410" width="480" height="90" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="460.0" y="453.0" font-size="21" fill="#ececec" text-anchor="middle">Score every possible question</text><text x="460.0" y="474.2" font-size="15" fill="#9a9a9a" text-anchor="middle">by how evenly it splits the pool</text><rect x="90" y="570" width="280" height="70" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="230.0" y="603.0" font-size="21" fill="#ececec" text-anchor="middle">Lifestyle questions</text><text x="230.0" y="624.2" font-size="15" fill="#9a9a9a" text-anchor="middle">sleep, diet, tidiness...</text><rect x="550" y="570" width="280" height="70" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="690.0" y="603.0" font-size="21" fill="#ececec" text-anchor="middle">Taste questions</text><text x="690.0" y="624.2" font-size="15" fill="#9a9a9a" text-anchor="middle">café hopping, gaming...</text><rect x="220" y="720" width="480" height="80" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="460.0" y="754.1" font-size="21" fill="#ececec" text-anchor="middle">LLM picks and phrases</text><text x="460.0" y="781.4" font-size="21" fill="#ececec" text-anchor="middle">the best question</text><rect x="270" y="860" width="380" height="80" rx="18" fill="none" stroke="#ececec" stroke-width="2" stroke-dasharray="8 7"/><text x="460.0" y="894.1" font-size="21" fill="#ececec" text-anchor="middle">12 questions asked or</text><text x="460.0" y="921.4" font-size="21" fill="#ececec" text-anchor="middle">8 people left?</text><rect x="310" y="1010" width="300" height="70" rx="18" fill="none" stroke="#ececec" stroke-width="2"/><text x="460.0" y="1052.8" font-size="21" fill="#ececec" text-anchor="middle">Show ranked matches</text><polyline points="460,100 460,150" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="460,240 460,290" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="460,360 460,410" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="460,500 460,535 230,535 230,570" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="460,500 460,535 690,535 690,570" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="230,640 230,680 460,680 460,720" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="690,640 690,680 460,680" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><text x="705" y="665.0" font-size="14" fill="#e08a2e" text-anchor="start">Qloo supplies the</text><text x="705" y="683.2" font-size="14" fill="#e08a2e" text-anchor="start">example entities</text><polyline points="460,800 460,860" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="460,940 460,1010" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><text x="478" y="982.0" font-size="16" fill="#e08a2e" text-anchor="start">Yes</text><polyline points="270,900 40,900 40,325 310,325" fill="none" stroke="#ececec" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><text x="54" y="780.0" font-size="15" fill="#e08a2e" text-anchor="start">No, narrow</text><text x="54" y="799.5" font-size="15" fill="#e08a2e" text-anchor="start">it further</text></svg>